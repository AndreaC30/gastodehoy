# Overlay de producción para GastoDeHoy (solo servicio app).
#
# La app queda en la red interna; expón HTTPS con un proxy en el host
# (Caddy, nginx, nginx-proxy, etc.) apuntando al contenedor «app».
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# En servidores con kya-system-hermes / hermes-core, añade además:
#   -f docker-compose.prod.server.yml
#
# Requiere en .env:
#   SITE_DOMAIN=gastodehoy.es
#   APP_SECRET=<openssl rand -hex 32>
#   ADMIN_API_KEY=<openssl rand -hex 32>
#   COOKIE_SECURE=true

services:
  app:
    build:
      context: .
      args:
        SITE_DOMAIN: ${SITE_DOMAIN}
        BUILD_REF: ${BUILD_REF:-prod}
    ports: []
    environment:
      DATABASE_URL: sqlite:////app/data/gastodehoy.db
      ENV: production
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      APP_SECRET: ${APP_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${SITE_DOMAIN}
      TRUST_FORWARDED_FOR: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    networks:
      backend:
        aliases:
          - app
