# Staging stack for https://dev.gastodehoy.es (rama develop).
#
# Standalone (no merges docker-compose.yml) so the service is NOT named «app»
# and cannot steal the prod DNS alias on gastodehoy_backend.
#
# Uso en el VPS (/root/gastodehoy-dev):
#   docker compose -f docker-compose.staging.yml up -d --build
#
# Requiere .env:
#   SITE_DOMAIN=dev.gastodehoy.es
#   APP_SECRET=<openssl rand -hex 32>   # distinto del de prod
#   ADMIN_API_KEY=<openssl rand -hex 32>
#   COOKIE_SECURE=true
#   CORS_ORIGINS=https://dev.gastodehoy.es
#   (+ SMTP / VAPID igual que prod si quieres probar correo/push)

name: gastodehoy-dev

services:
  app-dev:
    build:
      context: .
      args:
        SITE_DOMAIN: ${SITE_DOMAIN:-dev.gastodehoy.es}
        BUILD_REF: ${BUILD_REF:-staging}
    container_name: gastodehoy-dev-app
    restart: unless-stopped
    ports: []
    environment:
      DATABASE_URL: sqlite:////app/data/gastodehoy.db
      ENV: production
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      APP_SECRET: ${APP_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${SITE_DOMAIN:-dev.gastodehoy.es}
      TRUST_FORWARDED_FOR: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dev.gastodehoy.es}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@gastodehoy.es}
    volumes:
      - ./data:/app/data
    networks:
      backend:
        aliases:
          - app-dev
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  backend:
    external: true
    name: gastodehoy_backend
