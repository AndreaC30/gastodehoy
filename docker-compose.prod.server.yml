# Overlay opcional del VPS: kya-system-hermes + hermes-core (misma red backend).
# No incluye GastoDeHoy; combínalo con docker-compose.prod.yml.
#
# Uso (desde este repo, con app ya definida en prod.yml):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.prod.server.yml up -d --build
#
# kya / hermes desde sus propios compose (rutas del servidor):
#   docker compose -f /root/kya-system-hermes/docker-compose.yml \
#     -f docker-compose.prod.server.yml up -d --build kya

services:
  kya:
    build:
      context: /root/kya-system-hermes
    container_name: kya-system-hermes
    restart: unless-stopped
    ports: []
    volumes:
      - kya-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-875698538}
      - APP_SECRET=${APP_SECRET:-kya-secret-change-me}
      - APP_USER=${APP_USER:-admin}
      - APP_PASS=${APP_PASS:-kya2026}
      - COLLECTOR_INTERVAL=30
    networks:
      backend:
        aliases:
          - kya

  hermes-core:
    build:
      context: /root/hermes-core
    container_name: hermes-core
    restart: unless-stopped
    ports: []
    volumes:
      - /root/.hermes:/root/.hermes:ro
    environment:
      - APP_SECRET=${APP_SECRET:-hermes-secret-change-me}
      - APP_USER=${APP_USER:-admin}
      - APP_PASS=${APP_PASS:-hermes2026}
      - HERMES_HOME=/root/.hermes
    networks:
      backend:
        aliases:
          - hermes-core

volumes:
  kya-data:
