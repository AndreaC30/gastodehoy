# Overlay opcional del VPS: kya-system-hermes + hermes-core (misma red backend).
# No incluye GastoDeHoy; combínalo con docker-compose.prod.yml.
#
# Uso (desde este repo, con app ya definida en prod.yml):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.prod.server.yml up -d --build
#
# kya / hermes desde sus propios compose (rutas del servidor):
#   docker compose -f /root/kya-system-hermes/docker-compose.yml \
#     -f docker-compose.prod.server.yml up -d --build kya
#
# KYA_* y HERMES_* deben definirse en el entorno del servidor y no deben versionarse.

services:
  kya:
    build:
      context: /root/kya-system-hermes
    container_name: kya-system-hermes
    restart: unless-stopped
    ports: []
    volumes:
      - kya-data:/app/data
      - /var/log:/var/log:ro
    environment:
      - TELEGRAM_BOT_TOKEN=${KYA_TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${KYA_TELEGRAM_CHAT_ID:?required}
      - APP_SECRET=${KYA_APP_SECRET:?required}
      - APP_USER=${KYA_APP_USER:?required}
      - APP_PASS=${KYA_APP_PASS:?required}
      - COLLECTOR_INTERVAL=30
    networks:
      backend:
        aliases:
          - kya

  hermes-core:
    build:
      context: /root/hermes-core
    container_name: hermes-core
    restart: unless-stopped
    ports: []
    volumes:
      - /root/.hermes:/root/.hermes:ro
    environment:
      - APP_SECRET=${HERMES_APP_SECRET:?required}
      - APP_USER=${HERMES_APP_USER:?required}
      - APP_PASS=${HERMES_APP_PASS:?required}
      - HERMES_HOME=/root/.hermes
    networks:
      backend:
        aliases:
          - hermes-core

volumes:
  kya-data:
