    <!-- MUST be first — theme class + bg before paint (react-theme-switch-animation: localStorage.theme) -->
    <script>
      (function () {
        var bgDark = "#070A0D";
        var bgLight = "#f4f7fa";
        var theme = "dark";
        try {
          var stored = localStorage.getItem("theme");
          if (stored !== "light" && stored !== "dark") {
            var legacy = localStorage.getItem("gdh-theme");
            if (legacy === "light" || legacy === "dark") stored = legacy;
          }
          if (stored === "light" || stored === "dark") theme = stored;
          localStorage.setItem("theme", theme);
          localStorage.removeItem("gdh-theme");
        } catch (e) {}
        if (theme === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
        document.documentElement.style.backgroundColor =
          theme === "light" ? bgLight : bgDark;
        window.__gdhSplashStart = Date.now();
      })();
    </script>
